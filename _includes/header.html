<header class="nb-header" id="nb-header">
  <div class="nb-wrap">
    <a class="nb-brand" href="{{ site.baseurl | prepend: site.url }}/">{{ site.course_title }}</a>

    <nav class="nb-nav" id="nb-nav" aria-label="Main">
      <a href="{{ site.baseurl | prepend: site.url }}/"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
      {% assign nav_pages = site.pages | where_exp: "p", "p.nav_order" | sort: "nav_order" %}
      {% for p in nav_pages %}
        <a href="{{ p.url | prepend: site.baseurl | prepend: site.url }}"{% if page.url == p.url %} aria-current="page"{% endif %}>{{ p.nav_title | default: p.title }}</a>
      {% endfor %}
      <a href="https://nipunbatra.github.io/">Instructor</a>
    </nav>

    <button class="nb-icon-btn nb-theme" id="nb-theme" type="button" aria-label="Switch between light and dark">
      <svg class="nb-when-light" viewBox="0 0 16 16" aria-hidden="true"><path d="M11 4a4 4 0 0 1 0 8H8a4.992 4.992 0 0 0 2-4 4.992 4.992 0 0 0-2-4h3zm-6 8a4 4 0 1 1 0-8 4 4 0 0 1 0 8zM0 8a5 5 0 0 0 5 5h6a5 5 0 0 0 0-10H5a5 5 0 0 0-5 5z"/></svg>
      <svg class="nb-when-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3a5 5 0 0 0 0 10h6a5 5 0 0 0 0-10H5zm6 9a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>
    </button>
    <button class="nb-icon-btn nb-menu" id="nb-menu" type="button" aria-label="Menu" aria-controls="nb-nav" aria-expanded="false">
      <span class="nb-bar"></span><span class="nb-bar"></span><span class="nb-bar"></span>
    </button>
  </div>
</header>
<script>
  (function () {
    var root = document.documentElement;
    function current() {
      var t = root.getAttribute("data-theme");
      if (t) return t;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    root.setAttribute("data-theme", current());
    document.getElementById("nb-theme").addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
    var header = document.getElementById("nb-header");
    var menu = document.getElementById("nb-menu");
    menu.addEventListener("click", function () {
      var open = header.classList.toggle("is-open");
      menu.setAttribute("aria-expanded", open ? "true" : "false");
    });
  })();
</script>
